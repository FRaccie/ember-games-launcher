# Port 443: one door for the relay and the web sites. nginx reads only the TLS name (SNI) and hands the
# connection on unopened, from the client's own address (transparent; routing in ember-tproxy.sh), so the
# relay keeps its own TLS and certificate and still sees players' real addresses. Ports 4443 and 8443 are
# closed to the outside by the firewall.
map $ssl_preread_server_name $ember_tls_port {
    logs.fraccie.be  8443;
    default          4443;  # relay-eu.embernetplay.link, and connections without a name
}
map $remote_addr $ember_tls_addr {
    ~:       "[2a01:4f8:c2c:2312::1]";
    default  2.31.189.203;
}
server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_bind $remote_addr transparent;
    proxy_pass $ember_tls_addr:$ember_tls_port;
    # Relay connections live long; the default 10 minutes without traffic would cut quiet ones.
    proxy_timeout 1h;
}
