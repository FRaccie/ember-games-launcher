# logs.fraccie.be -> ember-logs. Reached through port 443 (nginx-stream-443.conf), which hands it over from the
# client's own address; 8443 is closed to the outside. The certificate comes from certbot's web check on port 80.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name logs.fraccie.be;
    ssl_certificate /etc/letsencrypt/live/logs.fraccie.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.fraccie.be/privkey.pem;
    client_max_body_size 26m;
    location / {
        proxy_pass http://127.0.0.1:8790;
        # Set, not appended: ember-logs reads the last address as the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
