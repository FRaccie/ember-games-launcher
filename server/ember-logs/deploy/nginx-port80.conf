# Port 80 on the EU relay box. The relay's plain-HTTP port is on 127.0.0.1:3340; nginx answers here so it can
# also answer the web sites' certificate checks (certbot --webroot /var/www/acme).
map $http_upgrade $ember_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ember_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name logs.fraccie.be;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://logs.fraccie.be$request_uri;
    }
}
