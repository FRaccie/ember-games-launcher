# Port 80 on the EU relay box. The relay (iroh-relay) keeps 443 and QUIC; its plain-HTTP port moved to
# 127.0.0.1:3340 so nginx can also answer the logs certificate's web check here.
map $http_upgrade $ember_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ember_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name logs.fraccie.be;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://logs.fraccie.be:8443$request_uri;
    }
}
