<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Games Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF8738" stroke-width="2" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-1 1-3 0-9z"/></svg>
      <div><b>EMBER</b><small>GAMES LAUNCHER</small></div>
    </div>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="library" aria-selected="true">Library</button>
      <button role="tab" data-tab="logs" aria-selected="false">Logs</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="steam-status"><span class="dot" id="steam-dot"></span><span id="steam-text">Looking for Steam…</span></div>
  </header>

  <div class="body">
    <section class="view on" id="view-library">
      <aside aria-label="Games">
        <div class="eyebrow">Your games</div>
        <div id="game-list"></div>
        <div class="aside-foot">
          <button class="btn small" id="rescan">Scan for games again</button>
        </div>
      </aside>
      <main id="detail" aria-live="polite"></main>
    </section>

    <section class="view" id="view-logs">
      <div class="page">
        <div><h2>Logs</h2><div class="rule"></div>
          <p class="muted">Zip the mods' logs for one game or all of them. Only what is new since the last bundle you sent goes in, and your account name is taken out of paths.</p></div>
        <div class="actions">
          <button class="btn primary" id="bundle-all"><span class="glyph">A</span>Zip new logs, all games</button>
          <button class="btn ghost" id="open-logs">Open logs folder</button>
        </div>
        <div id="logs-note"></div>
        <div class="eyebrow">Per game</div>
        <div class="grid" id="logs-games"></div>
        <div class="eyebrow">Waiting to send</div>
        <div class="rows" id="outbox"></div>
        <div class="eyebrow">Sent</div>
        <div class="rows" id="sent"></div>
      </div>
    </section>

    <section class="view" id="view-settings">
      <div class="page">
        <div><h2>Settings</h2><div class="rule"></div></div>
        <div class="rows" id="settings-rows"></div>
      </div>
    </section>
  </div>

  <footer id="hints"><span>LB / RB  Sections</span><span>A  Select</span><span>Y  Game options</span><span>B  Back</span></footer>
</div>

<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
