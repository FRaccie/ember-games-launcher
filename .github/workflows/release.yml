name: Release

# A version tag (v0.2.0, v0.2.0-beta.1) makes a DRAFT release, builds the Windows installer and the Linux AppImage
# and .deb, and adds them and SHA256SUMS to it. Nothing is public until someone presses Publish.
# The files go straight into the release, never into Actions artifacts (that storage is shared and full).
# Run it by hand (workflow_dispatch) to check that a branch builds on both systems: no tag, no release, no files kept.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$EVENT" = workflow_dispatch ]; then
            # A test build: the file names say which commit it is.
            echo "version=$version-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the version in Cargo.toml ($version); run tools/bump-version.sh first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  draft:
    name: Draft release
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the empty draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(--repo "$REPO" --draft --verify-tag --generate-notes --title "Ember Games Launcher $TAG")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"

  windows:
    name: Windows installer
    needs: [check, draft]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo test --locked -p egl-core
      - name: Build the installer
        working-directory: app/src-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund && npx --no-install tauri build --ci --bundles nsis
      - name: Name it
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe "dist/ember-games-launcher-$VERSION-windows-x64-setup.exe"
          ls -l dist
      # Only this step sees the token.
      - name: Add it to the draft
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO"

  linux:
    name: Linux AppImage and .deb
    needs: [check, draft]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.draft.result != 'failure' }}
    # The oldest supported runner, so the AppImage runs on older glibc (SteamOS included).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo test --locked -p egl-core
      - name: Build the AppImage and .deb
        working-directory: app/src-tauri
        run: npm ci --ignore-scripts --no-audit --no-fund && npx --no-install tauri build --ci --bundles appimage,deb
      - name: Name them
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage "dist/ember-games-launcher-$VERSION-linux-x86_64.AppImage"
          cp target/release/bundle/deb/*.deb "dist/ember-games-launcher-$VERSION-linux-amd64.deb"
          ls -l dist
      # Only this step sees the token.
      - name: Add them to the draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO"

  checksums:
    name: Checksums
    needs: [windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS of the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO"
          rm -f SHA256SUMS
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$TAG" ../SHA256SUMS --repo "$REPO" --clobber
